# Local development config. Copy to config.yaml and edit.
# Paths are relative to homelab-chatbot/backend/ (where uvicorn runs).
# For Docker deployment use config.example.yaml instead.

sync:
  interval_seconds: 3600
  state_file: "../data/sync_state.json"
  clone_root: "../data/repos"

repos: []  # add repos once the server starts up cleanly

embeddings:
  model: "BAAI/bge-small-en-v1.5"
  cache_dir: "../data/models"

vector_store:
  path: "../data/lance"

chat_db:
  path: "../data/chat.db"

kb_db:
  path: "../data/kb.db"

llm:
  default_provider: "anthropic"
  default_model: "claude-sonnet-4-6"
  ollama:
    host: "http://localhost:11434"
    tool_capable_models:
      - "llama3.1:8b"
      - "qwen2.5:7b"

retrieval:
  top_k: 6
  memory_turns: 10

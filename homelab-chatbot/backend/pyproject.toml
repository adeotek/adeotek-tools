[project]
name = "homelab-chatbot"
version = "0.1.0"
description = "Self-hosted RAG chatbot for a home-lab knowledge base"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "gitpython>=3.1.58",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "sentence-transformers>=3.3",
    "lancedb>=0.15",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-lancedb>=0.3",
    "llama-index-llms-anthropic>=0.6",
    "llama-index-llms-google-genai>=0.1",
    "llama-index-llms-ollama>=0.5",
    "llama-index-embeddings-huggingface>=0.4",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "pytesseract>=0.3",
    "Pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Security"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

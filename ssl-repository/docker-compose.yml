version: '3.8'

services:
  ssl-repository:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssl-repository
    ports:
      - "8080:8080"
    volumes:
      - ssl-data:/app/data
      - ssl-certificates:/app/certificates
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/sslrepository.db
      - Storage__CertificatesPath=/app/certificates
      - Storage__EncryptionKey=${ENCRYPTION_KEY:-CHANGE-THIS-KEY-IN-PRODUCTION}
      - Storage__EncryptByDefault=false
    restart: unless-stopped

volumes:
  ssl-data:
  ssl-certificates:

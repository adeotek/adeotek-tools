name: Build and Push homelab-chatbot Docker Image

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag for the Docker image (e.g. 0.1.0)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker tags
        id: docker_tags
        env:
          VERSION_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          TAGS="adeotek/homelab-chatbot:latest"
          if [ -n "$VERSION_TAG" ]; then
            TAGS="$TAGS,adeotek/homelab-chatbot:$VERSION_TAG"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./homelab-chatbot
          file: ./homelab-chatbot/Dockerfile
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

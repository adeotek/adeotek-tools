name: homelab-chatbot CI

on:
  pull_request:
    paths:
      - "homelab-chatbot/**"
      - ".github/workflows/homelab-chatbot-ci.yml"
  push:
    branches: [main]
    paths:
      - "homelab-chatbot/**"
      - ".github/workflows/homelab-chatbot-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.7"

      - name: Sync backend deps
        working-directory: homelab-chatbot/backend
        run: uv sync

      - name: Lint (ruff)
        working-directory: homelab-chatbot/backend
        run: uv run ruff check .

      - name: Unit tests
        working-directory: homelab-chatbot/backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: homelab-chatbot/frontend/package-lock.json

      - name: Install
        working-directory: homelab-chatbot/frontend
        run: npm ci

      - name: Lint
        working-directory: homelab-chatbot/frontend
        run: npm run lint

      - name: Unit tests
        working-directory: homelab-chatbot/frontend
        run: npm run test -- --run

      - name: Build (static export)
        working-directory: homelab-chatbot/frontend
        run: npm run build
